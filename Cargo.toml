[workspace]
members = [".", "examples/axum"]

[package]
name = "satisfy"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["miam-miam <MiamMiam@mailbox.org>"]
description = "Trait-based dependency injection container using a compile-time checked dependency graph"
license = "MIT OR Apache-2.0"
repository = "https://github.com/miam-miam/satisfy"
readme = "README.md"
keywords = ["dependency-injection", "di", "ioc", "dependency", "compile-time"]
categories = ["rust-patterns", "development-tools::testing"]
include = ["/src", "/README.md", "/compile-errors.md", "/LICENSE-*"]

[dependencies]
axum-core = { version = "0.5", optional = true }
http = { version = "1", optional = true }

[features]
axum = ["dep:axum-core", "dep:http"]

[dev-dependencies]
trybuild = "1"

# Run tests for testing.rs example
[[example]]
name = "testing"
test = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
