[workspace]
members = [".", "examples/axum"]

[package]
name = "satisfy"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[dependencies]
axum-core = { version = "0.5", optional = true }
http = { version = "1", optional = true }

[features]
axum = ["dep:axum-core", "dep:http"]

[dev-dependencies]
trybuild = "1"

# Run tests for testing.rs example
[[example]]
name = "testing"
test = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
